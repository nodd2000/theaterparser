name: theaterparser

x-app: &app
  build:
    context: .
    dockerfile: docker/app.Dockerfile
  image: theaterparser-app
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    # Telegram и LLM — через туннель, остальное напрямую
    TG_PROXY_URL: http://vpn:8118
    LLM_PROXY_URL: http://vpn:8118
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  vpn:
    build:
      context: .
      dockerfile: docker/vpn.Dockerfile
    environment:
      XRAY_LINK: ${XRAY_LINK:-}
    volumes:
      - ./docker/vpn/custom:/etc/xray/custom:ro
    # Порты наружу не публикуются: прокси доступен только сервисам внутри docker-сети
    healthcheck:
      test: ["CMD", "python3", "/healthcheck.py"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
